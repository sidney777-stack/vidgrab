name: Build VidGrab app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create app source files
        run: |
          mkdir -p app/src/main/java/com/sidney/vidgrab
          cat > settings.gradle <<'VIDGRAB_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VidGrab"
          include ":app"
          VIDGRAB_EOF
          cat > build.gradle <<'VIDGRAB_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          VIDGRAB_EOF
          cat > gradle.properties <<'VIDGRAB_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          VIDGRAB_EOF
          cat > app/build.gradle <<'VIDGRAB_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sidney.vidgrab'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sidney.vidgrab"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          VIDGRAB_EOF
          cat > app/src/main/AndroidManifest.xml <<'VIDGRAB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="VidGrab"
                  android:icon="@android:drawable/ic_media_play"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          VIDGRAB_EOF
          cat > app/src/main/java/com/sidney/vidgrab/MainActivity.java <<'VIDGRAB_EOF'
          package com.sidney.vidgrab;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.database.Cursor;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.widget.ProgressBar;
          import android.os.ParcelFileDescriptor;
          import android.media.MediaCodec;
          import android.media.MediaExtractor;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.provider.MediaStore;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileDescriptor;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.nio.ByteBuffer;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.ExecutionException;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.Collection;
          import java.util.LinkedHashMap;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;
              private static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;
              private static final String HOME = "https://duckduckgo.com";
              private static final String FOLDER = "VidGrab";
              private static final int PARALLEL = 6; // stream parts downloaded at the same time

              // Finds videos on the page: <video> elements plus video files in the page's network log.
              // Also sets up "long-press a video to download it".
              private static final String SCAN_JS =
                      "(function(){try{var o=[];document.querySelectorAll('video,video source').forEach(function(e){"
                      + "var s=e.currentSrc||e.src;if(s&&s.indexOf('http')===0)o.push(s);});"
                      + "try{performance.getEntriesByType('resource').forEach(function(e){var n=e.name||'';"
                      + "if(/\\.(mp4|webm|m4v|mov|3gp|mkv)([?#]|$)/i.test(n)||/m3u8/i.test(n)||/mime=video/i.test(n))o.push(n);});}catch(x){}"
                      + "if(o.length)VidGrab.found(JSON.stringify(o));}catch(e){}"
                      + "if(window.__vgLP)return;window.__vgLP=1;var t=null,sx=0,sy=0;"
                      + "function vidAt(x,y){try{var els=document.elementsFromPoint(x,y);for(var i=0;i<els.length;i++)if(els[i].tagName==='VIDEO')return els[i];}catch(e){}"
                      + "var vs=document.querySelectorAll('video');for(var j=0;j<vs.length;j++){var r=vs[j].getBoundingClientRect();"
                      + "if(r.width>0&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return vs[j];}return null;}"
                      + "function stop(){if(t){clearTimeout(t);t=null;}}"
                      + "document.addEventListener('touchstart',function(e){if(e.touches.length!==1){stop();return;}"
                      + "sx=e.touches[0].clientX;sy=e.touches[0].clientY;stop();t=setTimeout(function(){t=null;var v=vidAt(sx,sy);"
                      + "if(v)VidGrab.longPress(v.currentSrc||v.src||'');},650);},{passive:true,capture:true});"
                      + "document.addEventListener('touchmove',function(e){var q=e.touches[0];"
                      + "if(Math.abs(q.clientX-sx)>12||Math.abs(q.clientY-sy)>12)stop();},{passive:true,capture:true});"
                      + "document.addEventListener('touchend',stop,{passive:true,capture:true});"
                      + "document.addEventListener('touchcancel',stop,{passive:true,capture:true});"
                      + "})();";

              private WebView web;
              private EditText address;
              private Button grabBtn;
              private TextView status;
              private ProgressBar progress;
              private LinearLayout statusPanel;
              private volatile String streamMsg = null;
              private volatile int streamPct = -1;
              private volatile String dmMsg = null;
              private volatile int dmPct = -1;
              private final Set<Long> dmIds = Collections.synchronizedSet(new LinkedHashSet<>());

              private final Runnable dmPoller = new Runnable() {
                  @Override public void run() {
                      pollDownloads();
                      ui.postDelayed(this, 1000);
                  }
              };
              private final LinkedHashMap<String, String> found = new LinkedHashMap<>();
              private final Handler ui = new Handler(Looper.getMainLooper());
              private volatile String pageUrl = "";
              private volatile String userAgent = "";

              private final Runnable scanner = new Runnable() {
                  @Override public void run() {
                      if (web != null) web.evaluateJavascript(SCAN_JS, null);
                      ui.postDelayed(this, 3000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  setupWebView();
                  web.loadUrl(HOME);
                  ui.postDelayed(scanner, 3000);
                  ui.postDelayed(dmPoller, 1000);
              }

              // ---------- UI ----------

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setPadding(8, 8, 8, 8);

                  address = new EditText(this);
                  address.setSingleLine(true);
                  address.setHint("Search or type a web address");
                  address.setTextSize(15);
                  address.setImeOptions(EditorInfo.IME_ACTION_GO);
                  address.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  address.setSelectAllOnFocus(true);
                  address.setOnEditorActionListener((v, actionId, event) -> {
                      go(address.getText().toString());
                      return true;
                  });
                  bar.addView(address, new LinearLayout.LayoutParams(0, WRAP, 1f));

                  Button goBtn = new Button(this);
                  goBtn.setText("Go");
                  goBtn.setOnClickListener(v -> go(address.getText().toString()));
                  bar.addView(goBtn, new LinearLayout.LayoutParams(WRAP, WRAP));
                  root.addView(bar, new LinearLayout.LayoutParams(MATCH, WRAP));

                  statusPanel = new LinearLayout(this);
                  statusPanel.setOrientation(LinearLayout.VERTICAL);
                  statusPanel.setPadding(24, 0, 24, 8);
                  statusPanel.setVisibility(View.GONE);
                  status = new TextView(this);
                  status.setTextSize(13);
                  statusPanel.addView(status, new LinearLayout.LayoutParams(MATCH, WRAP));
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  statusPanel.addView(progress, new LinearLayout.LayoutParams(MATCH, WRAP));
                  root.addView(statusPanel, new LinearLayout.LayoutParams(MATCH, WRAP));

                  FrameLayout frame = new FrameLayout(this);
                  web = new WebView(this);
                  frame.addView(web, new FrameLayout.LayoutParams(MATCH, MATCH));

                  grabBtn = new Button(this);
                  grabBtn.setText("Download video");
                  grabBtn.setAllCaps(false);
                  grabBtn.setTextColor(Color.WHITE);
                  grabBtn.setBackgroundColor(Color.parseColor("#D9462B"));
                  grabBtn.setPadding(40, 20, 40, 20);
                  grabBtn.setVisibility(View.GONE);
                  grabBtn.setOnClickListener(v -> showFound());
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM | Gravity.END);
                  lp.setMargins(0, 0, 32, 64);
                  frame.addView(grabBtn, lp);

                  root.addView(frame, new LinearLayout.LayoutParams(MATCH, 0, 1f));
                  setContentView(root);
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  userAgent = s.getUserAgentString();

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  web.addJavascriptInterface(new Bridge(), "VidGrab");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          pageUrl = url;
                          if (!address.hasFocus()) address.setText(url);
                          synchronized (found) { found.clear(); }
                          refreshButton();
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageUrl = url;
                          if (!address.hasFocus()) address.setText(url);
                          view.evaluateJavascript(SCAN_JS, null);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String scheme = request.getUrl().getScheme();
                          // Ignore app links (intent:, market:, etc.) so they don't break the browser.
                          return scheme == null || !(scheme.equals("http") || scheme.equals("https"));
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          checkRequest(request);
                          return null; // let the page load normally
                      }
                  });

                  // Some sites fetch videos through a background "service worker": watch those too.
                  try {
                      ServiceWorkerController.getInstance().setServiceWorkerClient(new ServiceWorkerClient() {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {
                              checkRequest(request);
                              return null;
                          }
                      });
                  } catch (Exception ignored) { }

                  web.setWebChromeClient(new WebChromeClient() {
                      private View custom;

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          custom = view;
                          custom.setBackgroundColor(Color.BLACK);
                          ((FrameLayout) getWindow().getDecorView()).addView(custom, new FrameLayout.LayoutParams(MATCH, MATCH));
                      }

                      @Override
                      public void onHideCustomView() {
                          if (custom != null) {
                              ((FrameLayout) getWindow().getDecorView()).removeView(custom);
                              custom = null;
                          }
                      }
                  });

                  web.setDownloadListener((url, ua, contentDisposition, mimetype, length) -> {
                      String name = URLUtil.guessFileName(url, contentDisposition, mimetype);
                      enqueueDownload(url, name);
                  });
              }

              private void go(String text) {
                  String t = text == null ? "" : text.trim();
                  if (t.isEmpty()) return;
                  String url;
                  if (t.startsWith("http://") || t.startsWith("https://")) {
                      url = t;
                  } else if (!t.contains(" ") && t.contains(".")) {
                      url = "https://" + t;
                  } else {
                      try {
                          url = "https://duckduckgo.com/?q=" + URLEncoder.encode(t, "UTF-8");
                      } catch (Exception e) {
                          url = HOME;
                      }
                  }
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(address.getWindowToken(), 0);
                  address.clearFocus();
                  web.requestFocus();
                  web.loadUrl(url);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  ui.removeCallbacks(scanner);
                  ui.removeCallbacks(dmPoller);
                  if (web != null) web.destroy();
                  super.onDestroy();
              }

              // ---------- Video detection ----------

              private void checkRequest(WebResourceRequest request) {
                  final String u = request.getUrl().toString();
                  boolean video = looksLikeVideo(u);
                  if (!video && !isSegment(u)) {
                      // Players ask for videos in byte ranges; that's a strong sign of a video file
                      // even when the link has no ".mp4" in it.
                      Map<String, String> h = request.getRequestHeaders();
                      if (h != null) {
                          for (Map.Entry<String, String> e : h.entrySet()) {
                              if ("range".equalsIgnoreCase(e.getKey()) && e.getValue() != null
                                      && e.getValue().startsWith("bytes=") && !looksLikeNonVideo(u)) {
                                  video = true;
                                  break;
                              }
                          }
                      }
                  }
                  if (video) ui.post(() -> addFound(u));
              }

              private static boolean isSegment(String url) {
                  String p = pathOf(url);
                  return p.endsWith(".ts") || p.endsWith(".m4s") || p.endsWith(".aac") || p.endsWith(".vtt");
              }

              private static boolean looksLikeNonVideo(String url) {
                  String p = pathOf(url);
                  String[] skip = {".js", ".css", ".json", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico",
                          ".woff", ".woff2", ".ttf", ".otf", ".html", ".htm", ".mp3", ".m4a", ".ogg", ".wav", ".wasm", ".pdf"};
                  for (String s : skip) if (p.endsWith(s)) return true;
                  return false;
              }

              private class Bridge {
                  @JavascriptInterface
                  public void longPress(String src) {
                      ui.post(() -> onVideoLongPress(src));
                  }

                  @JavascriptInterface
                  public void found(String json) {
                      try {
                          JSONArray a = new JSONArray(json);
                          for (int i = 0; i < a.length(); i++) {
                              final String u = a.getString(i);
                              ui.post(() -> addFound(u));
                          }
                      } catch (Exception ignored) { }
                  }
              }

              private static String pathOf(String url) {
                  String p = url;
                  int q = p.indexOf('?');
                  if (q >= 0) p = p.substring(0, q);
                  int h = p.indexOf('#');
                  if (h >= 0) p = p.substring(0, h);
                  return p.toLowerCase(Locale.ROOT);
              }

              private static boolean isHls(String url) {
                  return url.toLowerCase(Locale.ROOT).contains("m3u8");
              }

              private static boolean looksLikeVideo(String url) {
                  if (!(url.startsWith("http://") || url.startsWith("https://"))) return false;
                  String p = pathOf(url);
                  if (p.endsWith(".mp4") || p.endsWith(".webm") || p.endsWith(".m4v") || p.endsWith(".mov")
                          || p.endsWith(".3gp") || p.endsWith(".mkv")) return true;
                  String l = url.toLowerCase(Locale.ROOT);
                  return l.contains("m3u8") || l.contains("mime=video");
              }

              // Removes "partial download" parameters so we fetch the whole file.
              private static String normalize(String url) {
                  String u = url.replaceAll("([?&])(bytestart|byteend|range|rn|rbuf|sq)=[^&]*&?", "$1");
                  if (u.endsWith("?") || u.endsWith("&")) u = u.substring(0, u.length() - 1);
                  return u;
              }

              private void addFound(String raw) {
                  if (raw == null || raw.startsWith("blob:")) return;
                  String u = normalize(raw);
                  synchronized (found) {
                      if (found.containsKey(u)) return;
                      String kind = isHls(u) ? "Stream" : "Video";
                      String name = lastSegment(u);
                      found.put(u, kind + " " + (found.size() + 1) + ": " + name);
                  }
                  refreshButton();
              }

              private void refreshButton() {
                  int n;
                  synchronized (found) { n = found.size(); }
                  if (n == 0) {
                      grabBtn.setVisibility(View.GONE);
                  } else {
                      grabBtn.setText(n == 1 ? "Download video" : "Download video (" + n + ")");
                      grabBtn.setVisibility(View.VISIBLE);
                  }
              }

              private void onVideoLongPress(String src) {
                  boolean real = src != null && (src.startsWith("http://") || src.startsWith("https://"));
                  if (real) addFound(src);
                  int n;
                  synchronized (found) { n = found.size(); }
                  if (real && n <= 1) {
                      final String u = normalize(src);
                      new AlertDialog.Builder(this)
                              .setTitle("Download this video?")
                              .setPositiveButton("Download", (d, w) -> startDownload(u))
                              .setNegativeButton("Cancel", null)
                              .show();
                  } else if (n > 0) {
                      showFound();
                  } else {
                      toast("Can't find this video's file yet. Let it play for a few seconds, then long-press again.");
                  }
              }

              private static final Pattern DIGITS = Pattern.compile("\\d+");

              private void showFound() {
                  List<String> streams = new ArrayList<>();
                  LinkedHashMap<String, String> byPath = new LinkedHashMap<>(); // one entry per file path
                  synchronized (found) {
                      for (String u : found.keySet()) {
                          if (isHls(u)) streams.add(u);
                          else byPath.put(pathOf(u), u);
                      }
                  }
                  // Files whose addresses differ only by a number are pieces of one video.
                  LinkedHashMap<String, List<String>> groups = new LinkedHashMap<>();
                  for (String u : byPath.values()) {
                      String key = pathOf(u).replaceAll("\\d+", "#");
                      List<String> g = groups.get(key);
                      if (g == null) { g = new ArrayList<>(); groups.put(key, g); }
                      g.add(u);
                  }

                  final List<String> labels = new ArrayList<>();
                  final List<Runnable> actions = new ArrayList<>();
                  int i = 1;
                  for (String u : streams) {
                      labels.add("Full video " + (i++) + " (stream): " + lastSegment(u));
                      actions.add(() -> startDownload(u));
                  }
                  for (List<String> g : groups.values()) {
                      if (g.size() >= 2 && varyingRun(g) >= 0) {
                          final List<String> pieces = new ArrayList<>(g);
                          labels.add("Full video " + (i++) + " (joins all pieces): " + lastSegment(g.get(0)));
                          actions.add(() -> {
                              toast("Saving all pieces… keep the app open.");
                              new Thread(() -> joinPieces(pieces)).start();
                          });
                      }
                  }
                  for (List<String> g : groups.values()) {
                      if (g.size() >= 2 && varyingRun(g) >= 0) continue;
                      for (String u : g) {
                          labels.add("Video file " + (i++) + ": " + lastSegment(u));
                          actions.add(() -> startDownload(u));
                      }
                  }
                  if (labels.isEmpty()) {
                      toast("No video found yet. Press play on the video first.");
                      return;
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Videos found on this page")
                          .setItems(labels.toArray(new String[0]), (d, which) -> actions.get(which).run())
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              // Which number in the address changes between pieces (-1 if none).
              private static int varyingRun(List<String> urls) {
                  List<List<String>> runs = new ArrayList<>();
                  int min = Integer.MAX_VALUE;
                  for (String u : urls) {
                      List<String> r = new ArrayList<>();
                      Matcher m = DIGITS.matcher(pathOf(u));
                      while (m.find()) r.add(m.group());
                      runs.add(r);
                      min = Math.min(min, r.size());
                  }
                  for (int j = min - 1; j >= 0; j--) {
                      String first = runs.get(0).get(j);
                      for (List<String> r : runs) {
                          if (!r.get(j).equals(first)) return j;
                      }
                  }
                  return -1;
              }

              private static long runValue(String url, int run) {
                  Matcher m = DIGITS.matcher(pathOf(url));
                  for (int k = 0; m.find(); k++) {
                      if (k == run) {
                          try { return Long.parseLong(m.group()); } catch (NumberFormatException e) { return -1; }
                      }
                  }
                  return -1;
              }

              // Same address with the piece number swapped (keeps leading zeros).
              private static String withNumber(String url, int run, long n) {
                  int q = url.indexOf('?');
                  String head = q >= 0 ? url.substring(0, q) : url;
                  String tail = q >= 0 ? url.substring(q) : "";
                  Matcher m = DIGITS.matcher(head);
                  for (int k = 0; m.find(); k++) {
                      if (k == run) {
                          String old = m.group();
                          String num = Long.toString(n);
                          if (old.length() > 1 && old.startsWith("0")) {
                              while (num.length() < old.length()) num = "0" + num;
                          }
                          return head.substring(0, m.start()) + num + head.substring(m.end()) + tail;
                      }
                  }
                  return url;
              }

              private boolean exists(String url) {
                  try {
                      open(url).disconnect();
                      return true;
                  } catch (IOException e) {
                      return false;
                  }
              }

              private void joinPieces(List<String> seen) {
                  File dir = new File(getCacheDir(), "p_" + System.nanoTime());
                  dir.mkdirs();
                  Uri out = null;
                  ContentResolver cr = getContentResolver();
                  ExecutorService pool = Executors.newFixedThreadPool(PARALLEL);
                  try {
                      int run = varyingRun(seen);
                      String template = seen.get(0);
                      long lo = Long.MAX_VALUE;
                      List<long[]> order = new ArrayList<>();
                      for (int k = 0; k < seen.size(); k++) {
                          long v = runValue(seen.get(k), run);
                          order.add(new long[]{v, k});
                          if (v >= 0 && v < lo) { lo = v; template = seen.get(k); }
                      }
                      List<File> pieces = new ArrayList<>();

                      if (lo != Long.MAX_VALUE) {
                          // Look for earlier pieces the player didn't load.
                          setStream("Looking for the start of the video…", -1);
                          int back = 0;
                          while (lo > 0 && back < 50 && exists(withNumber(template, run, lo - 1))) { lo--; back++; }

                          // Download pieces in order until the website says there are no more.
                          long n = lo;
                          boolean end = false;
                          while (!end && pieces.size() < 20000) {
                              List<Future<byte[]>> batch = new ArrayList<>();
                              for (int k = 0; k < PARALLEL; k++) {
                                  final String u = withNumber(template, run, n + k);
                                  batch.add(pool.submit(() -> fetchBytes(u)));
                              }
                              for (Future<byte[]> f : batch) {
                                  byte[] data;
                                  try {
                                      data = f.get();
                                  } catch (ExecutionException ee) {
                                      end = true;
                                      break;
                                  }
                                  File pf = new File(dir, "piece_" + pieces.size());
                                  try (OutputStream os = new FileOutputStream(pf)) { os.write(data); }
                                  pieces.add(pf);
                              }
                              for (Future<byte[]> f : batch) f.cancel(true);
                              n += PARALLEL;
                              setStream("Saving video… " + pieces.size() + " pieces so far", -1);
                          }
                      }

                      if (pieces.size() < seen.size()) {
                          // Couldn't guess the other pieces: just join the ones the player loaded.
                          for (File f : pieces) f.delete();
                          pieces.clear();
                          Collections.sort(order, (x, y) -> Long.compare(x[0], y[0]));
                          for (long[] o : order) {
                              File pf = new File(dir, "piece_" + pieces.size());
                              try (OutputStream os = new FileOutputStream(pf)) { os.write(fetchBytes(seen.get((int) o[1]))); }
                              pieces.add(pf);
                              setStream("Saving video… piece " + pieces.size() + " of " + seen.size(),
                                      pieces.size() * 100 / seen.size());
                          }
                      }
                      if (pieces.isEmpty()) throw new IOException("Couldn't download the video pieces");

                      setStream("Joining " + pieces.size() + " pieces…", -1);
                      String name = fileName(template, "mp4");
                      out = newDownload(name, "video/mp4");
                      boolean ok = false;
                      try (ParcelFileDescriptor pfd = cr.openFileDescriptor(out, "rw")) {
                          if (pfd == null) throw new IOException("Couldn't open file");
                          remuxJoin(pieces, pfd.getFileDescriptor());   // pieces that are complete little videos
                          ok = true;
                      } catch (Exception e) {
                          ok = false;
                      }
                      if (!ok) {
                          // Pieces that only make sense glued together end to end.
                          File joined = new File(dir, "joined");
                          try (OutputStream os = new FileOutputStream(joined)) {
                              byte[] buf = new byte[65536];
                              for (File pf : pieces) {
                                  try (InputStream in = new FileInputStream(pf)) {
                                      int r;
                                      while ((r = in.read(buf)) > 0) os.write(buf, 0, r);
                                  }
                              }
                          }
                          cr.delete(out, null, null);
                          out = newDownload(name, "video/mp4");
                          try (ParcelFileDescriptor pfd = cr.openFileDescriptor(out, "rw")) {
                              if (pfd == null) throw new IOException("Couldn't open file");
                              List<File> one = new ArrayList<>();
                              one.add(joined);
                              remux(one, pfd.getFileDescriptor());
                          }
                      }
                      finishDownload(out);
                      toast("Saved full video (" + pieces.size() + " pieces) to Downloads/" + FOLDER + "/" + name);
                  } catch (Exception e) {
                      if (out != null) {
                          try { cr.delete(out, null, null); } catch (Exception ignored) { }
                      }
                      toast("Couldn't save video: " + e.getMessage());
                  } finally {
                      pool.shutdownNow();
                      File[] fs = dir.listFiles();
                      if (fs != null) for (File f : fs) f.delete();
                      dir.delete();
                      setStream(null, -1);
                  }
              }

              // Joins pieces that are each a complete short video, one after another.
              private static void remuxJoin(List<File> pieces, FileDescriptor dst) throws IOException {
                  MediaMuxer mux = null;
                  boolean started = false;
                  try {
                      mux = new MediaMuxer(dst, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      int vOut = -1, aOut = -1;
                      int maxSize = 4 * 1024 * 1024;
                      MediaExtractor first = new MediaExtractor();
                      try {
                          first.setDataSource(pieces.get(0).getAbsolutePath());
                          for (int i = 0; i < first.getTrackCount(); i++) {
                              MediaFormat f = first.getTrackFormat(i);
                              String mime = f.getString(MediaFormat.KEY_MIME);
                              if (mime == null) continue;
                              if (mime.startsWith("video/") && vOut < 0) vOut = mux.addTrack(f);
                              else if (mime.startsWith("audio/") && aOut < 0) aOut = mux.addTrack(f);
                              else continue;
                              if (f.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                                  maxSize = Math.max(maxSize, f.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE));
                              }
                          }
                      } finally {
                          first.release();
                      }
                      if (vOut < 0 && aOut < 0) throw new IOException("No playable tracks");
                      mux.start();
                      started = true;

                      ByteBuffer buf = ByteBuffer.allocate(maxSize);
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      long offset = 0;
                      long lastV = -1, lastA = -1;
                      for (File pf : pieces) {
                          MediaExtractor ex = new MediaExtractor();
                          try {
                              ex.setDataSource(pf.getAbsolutePath());
                              int n = ex.getTrackCount();
                              int[] map = new int[n];
                              for (int i = 0; i < n; i++) {
                                  map[i] = -1;
                                  String mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME);
                                  if (mime == null) continue;
                                  if (mime.startsWith("video/") && vOut >= 0) map[i] = vOut;
                                  else if (mime.startsWith("audio/") && aOut >= 0) map[i] = aOut;
                                  if (map[i] >= 0) ex.selectTrack(i);
                              }
                              long base = ex.getSampleTime();
                              if (base < 0) throw new IOException("Empty piece");
                              long maxRel = 0;
                              while (true) {
                                  buf.clear();
                                  int size = ex.readSampleData(buf, 0);
                                  if (size < 0) break;
                                  int t = ex.getSampleTrackIndex();
                                  long rel = Math.max(0, ex.getSampleTime() - base);
                                  if (size > 0 && t >= 0 && map[t] >= 0) {
                                      long ts = offset + rel;
                                      if (map[t] == vOut) { if (ts <= lastV) ts = lastV + 1; lastV = ts; }
                                      else { if (ts <= lastA) ts = lastA + 1; lastA = ts; }
                                      info.offset = 0;
                                      info.size = size;
                                      info.presentationTimeUs = ts;
                                      info.flags = (ex.getSampleFlags() & MediaExtractor.SAMPLE_FLAG_SYNC) != 0
                                              ? MediaCodec.BUFFER_FLAG_KEY_FRAME : 0;
                                      mux.writeSampleData(map[t], buf, info);
                                      maxRel = Math.max(maxRel, rel);
                                  }
                                  ex.advance();
                              }
                              offset += maxRel + 33000;
                          } finally {
                              ex.release();
                          }
                      }
                      mux.stop();
                      started = false;
                  } catch (IOException e) {
                      throw e;
                  } catch (Exception e) {
                      throw new IOException(String.valueOf(e));
                  } finally {
                      if (mux != null) {
                          try { if (started) mux.stop(); } catch (Exception ignored) { }
                          try { mux.release(); } catch (Exception ignored) { }
                      }
                  }
              }

              // ---------- Downloading ----------

              private void startDownload(String url) {
                  if (isHls(url)) {
                      toast("Saving stream… keep the app open.");
                      new Thread(() -> downloadHls(url)).start();
                  } else {
                      String ext = extensionOf(url, "mp4");
                      enqueueDownload(url, fileName(url, ext));
                  }
              }

              private void enqueueDownload(String url, String name) {
                  try {
                      DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                      r.addRequestHeader("User-Agent", userAgent);
                      String cookie = CookieManager.getInstance().getCookie(url);
                      if (cookie != null) r.addRequestHeader("Cookie", cookie);
                      if (pageUrl != null && !pageUrl.isEmpty()) r.addRequestHeader("Referer", pageUrl);
                      r.setTitle(name);
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, FOLDER + "/" + name);
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      dmIds.add(dm.enqueue(r));
                      pollDownloads();
                      toast("Downloading to Downloads/" + FOLDER);
                  } catch (Exception e) {
                      toast("Couldn't start download: " + e.getMessage());
                  }
              }

              private Uri newDownload(String name, String mime) throws IOException {
                  ContentValues cv = new ContentValues();
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + FOLDER);
                  cv.put(MediaStore.MediaColumns.IS_PENDING, 1);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                  if (u == null) throw new IOException("Couldn't create file in Downloads");
                  return u;
              }

              private void finishDownload(Uri u) {
                  ContentValues done = new ContentValues();
                  done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  getContentResolver().update(u, done, null, null);
              }

              private static String attrStr(String line, String attr) {
                  Matcher m = Pattern.compile(attr + "=\"([^\"]*)\"").matcher(line);
                  if (m.find()) return m.group(1);
                  m = Pattern.compile(attr + "=([^,]*)").matcher(line);
                  return m.find() ? m.group(1) : null;
              }

              private void downloadHls(String m3u8) {
                  File vidTmp = new File(getCacheDir(), "v_" + System.nanoTime());
                  File audTmp = new File(getCacheDir(), "a_" + System.nanoTime());
                  Uri out = null;
                  ContentResolver cr = getContentResolver();
                  try {
                      setStatus("Reading stream…");
                      String videoUrl = m3u8;
                      String audioUrl = null;
                      String text = fetchText(m3u8);

                      // A "master" playlist lists several qualities: pick the best one,
                      // plus its separate sound track if the site keeps sound apart.
                      if (text.contains("#EXT-X-STREAM-INF")) {
                          String[] lines = text.split("\\r?\\n");
                          long best = -1;
                          String bestUri = null;
                          String bestAudioGroup = null;
                          for (int i = 0; i < lines.length; i++) {
                              String l = lines[i].trim();
                              if (!l.startsWith("#EXT-X-STREAM-INF")) continue;
                              long bw = attrLong(l, "BANDWIDTH");
                              for (int j = i + 1; j < lines.length; j++) {
                                  String n = lines[j].trim();
                                  if (n.isEmpty() || n.startsWith("#")) continue;
                                  if (bw > best) { best = bw; bestUri = n; bestAudioGroup = attrStr(l, "AUDIO"); }
                                  break;
                              }
                          }
                          if (bestUri == null) throw new IOException("No video found in stream");
                          videoUrl = resolve(m3u8, bestUri);

                          String audioUri = null;
                          for (String raw : lines) {
                              String l = raw.trim();
                              if (!l.startsWith("#EXT-X-MEDIA") || !l.contains("TYPE=AUDIO")) continue;
                              String uri = attrStr(l, "URI");
                              if (uri == null) continue;
                              String group = attrStr(l, "GROUP-ID");
                              if (bestAudioGroup != null && group != null && !bestAudioGroup.equals(group)) continue;
                              if (audioUri == null || "YES".equals(attrStr(l, "DEFAULT"))) audioUri = uri;
                          }
                          if (audioUri != null) audioUrl = resolve(m3u8, audioUri);
                      }

                      boolean live = savePlaylist(videoUrl, vidTmp, audioUrl != null ? "video" : "stream");
                      if (audioUrl != null) savePlaylist(audioUrl, audTmp, "sound");

                      // Rebuild the pieces into one normal MP4 so every player shows the full length.
                      setStatus("Finishing video…");
                      String name = fileName(m3u8, "mp4");
                      out = newDownload(name, "video/mp4");
                      boolean ok;
                      try (ParcelFileDescriptor pfd = cr.openFileDescriptor(out, "rw")) {
                          if (pfd == null) throw new IOException("Couldn't open file");
                          List<File> srcs = new ArrayList<>();
                          srcs.add(vidTmp);
                          if (audioUrl != null) srcs.add(audTmp);
                          remux(srcs, pfd.getFileDescriptor());
                          ok = true;
                      } catch (Exception e) {
                          ok = false;
                      }

                      if (!ok) {
                          // Fall back to saving the raw pieces joined together (plays in VLC).
                          cr.delete(out, null, null);
                          out = null;
                          boolean ts = firstByte(vidTmp) == 0x47;
                          name = fileName(m3u8, ts ? "ts" : "mp4");
                          out = newDownload(name, ts ? "video/mp2t" : "video/mp4");
                          try (OutputStream os = cr.openOutputStream(out);
                               InputStream in = new FileInputStream(vidTmp)) {
                              if (os == null) throw new IOException("Couldn't open file for writing");
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                          }
                      }
                      finishDownload(out);
                      String msg = "Saved to Downloads/" + FOLDER + "/" + name;
                      if (!ok) msg += " (if it won't play, open it with VLC)";
                      if (live) msg += ". This was a live stream, so only the part available so far was saved.";
                      toast(msg);
                  } catch (Exception e) {
                      if (out != null) {
                          try { cr.delete(out, null, null); } catch (Exception ignored) { }
                      }
                      toast("Couldn't save stream: " + e.getMessage());
                  } finally {
                      vidTmp.delete();
                      audTmp.delete();
                      setStatus(null);
                  }
              }

              private static int firstByte(File f) {
                  try (InputStream in = new FileInputStream(f)) {
                      return in.read();
                  } catch (IOException e) {
                      return -1;
                  }
              }

              // Downloads every piece of a stream playlist into one file. Returns true if it's a live stream.
              private boolean savePlaylist(String playlistUrl, File dest, String label) throws Exception {
                  String text = fetchText(playlistUrl);
                  String[] lines = text.split("\\r?\\n");
                  boolean byteRange = text.contains("#EXT-X-BYTERANGE");
                  String initUri = null;
                  Collection<String> segments = byteRange ? new LinkedHashSet<>() : new ArrayList<>();
                  for (String raw : lines) {
                      String l = raw.trim();
                      if (l.isEmpty()) continue;
                      if (l.startsWith("#EXT-X-KEY") && !l.contains("METHOD=NONE")) {
                          throw new IOException("This video is protected and can't be saved.");
                      }
                      if (l.startsWith("#EXT-X-MAP")) {
                          String u = attrStr(l, "URI");
                          if (u != null && initUri == null) initUri = resolve(playlistUrl, u);
                          continue;
                      }
                      if (l.startsWith("#")) continue;
                      segments.add(resolve(playlistUrl, l));
                  }
                  if (segments.isEmpty()) throw new IOException("Stream has no video parts");

                  ExecutorService pool = Executors.newFixedThreadPool(PARALLEL);
                  try (OutputStream os = new FileOutputStream(dest)) {
                      if (initUri != null && !segments.contains(initUri)) os.write(fetchBytes(initUri));
                      // Fetch several parts at once, but write them to the file in the right order.
                      final List<String> segList = new ArrayList<>(segments);
                      final int total = segList.size();
                      ArrayDeque<Future<byte[]>> queue = new ArrayDeque<>();
                      int next = 0;
                      while (next < total && queue.size() < PARALLEL * 2) {
                          final String u = segList.get(next++);
                          queue.add(pool.submit(() -> fetchBytes(u)));
                      }
                      for (int i = 0; i < total; i++) {
                          byte[] data;
                          try {
                              data = queue.poll().get();
                          } catch (ExecutionException ee) {
                              Throwable c = ee.getCause();
                              throw (c instanceof IOException) ? (IOException) c : new IOException(String.valueOf(c));
                          }
                          os.write(data);
                          if (next < total) {
                              final String u = segList.get(next++);
                              queue.add(pool.submit(() -> fetchBytes(u)));
                          }
                          int pct = (int) ((i + 1) * 100L / total);
                          setStream("Saving " + label + "… " + pct + "% (part " + (i + 1) + " of " + total + ")", pct);
                      }
                  } finally {
                      pool.shutdownNow();
                  }
                  return !text.contains("#EXT-X-ENDLIST");
              }

              // Copies the video and sound tracks from the downloaded pieces into a standard MP4 file.
              private static void remux(List<File> sources, FileDescriptor dst) throws IOException {
                  List<MediaExtractor> exs = new ArrayList<>();
                  MediaMuxer mux = null;
                  boolean started = false;
                  try {
                      mux = new MediaMuxer(dst, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      boolean haveSeparateAudio = sources.size() > 1;
                      List<int[]> maps = new ArrayList<>();
                      int maxSize = 4 * 1024 * 1024;
                      int tracks = 0;
                      for (int s = 0; s < sources.size(); s++) {
                          MediaExtractor ex = new MediaExtractor();
                          exs.add(ex);
                          ex.setDataSource(sources.get(s).getAbsolutePath());
                          int n = ex.getTrackCount();
                          int[] map = new int[n];
                          for (int i = 0; i < n; i++) {
                              map[i] = -1;
                              MediaFormat f = ex.getTrackFormat(i);
                              String mime = f.getString(MediaFormat.KEY_MIME);
                              if (mime == null) continue;
                              boolean isVideo = mime.startsWith("video/");
                              boolean isAudio = mime.startsWith("audio/");
                              boolean want = (s == 0) ? (isVideo || (isAudio && !haveSeparateAudio)) : isAudio;
                              if (!want) continue;
                              map[i] = mux.addTrack(f);
                              ex.selectTrack(i);
                              tracks++;
                              if (f.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                                  maxSize = Math.max(maxSize, f.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE));
                              }
                          }
                          maps.add(map);
                      }
                      if (tracks == 0) throw new IOException("No playable tracks");
                      mux.start();
                      started = true;

                      long base = Long.MAX_VALUE;
                      for (MediaExtractor ex : exs) {
                          long t = ex.getSampleTime();
                          if (t >= 0) base = Math.min(base, t);
                      }
                      if (base == Long.MAX_VALUE) base = 0;

                      ByteBuffer buf = ByteBuffer.allocate(maxSize);
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      long[] lastTs = new long[64];
                      Arrays.fill(lastTs, -1);
                      while (true) {
                          // Take the next sample in time order across all sources.
                          int pick = -1;
                          long pickTs = Long.MAX_VALUE;
                          for (int s = 0; s < exs.size(); s++) {
                              long t = exs.get(s).getSampleTime();
                              if (t >= 0 && t < pickTs) { pickTs = t; pick = s; }
                          }
                          if (pick < 0) break;
                          MediaExtractor ex = exs.get(pick);
                          buf.clear();
                          int size = ex.readSampleData(buf, 0);
                          int t = ex.getSampleTrackIndex();
                          if (size > 0 && t >= 0 && maps.get(pick)[t] >= 0) {
                              int outTrack = maps.get(pick)[t];
                              long ts = Math.max(0, pickTs - base);
                              if (outTrack < lastTs.length && ts <= lastTs[outTrack]) ts = lastTs[outTrack] + 1;
                              if (outTrack < lastTs.length) lastTs[outTrack] = ts;
                              info.offset = 0;
                              info.size = size;
                              info.presentationTimeUs = ts;
                              info.flags = (ex.getSampleFlags() & MediaExtractor.SAMPLE_FLAG_SYNC) != 0
                                      ? MediaCodec.BUFFER_FLAG_KEY_FRAME : 0;
                              mux.writeSampleData(outTrack, buf, info);
                          }
                          ex.advance();
                      }
                      mux.stop();
                      started = false;
                  } catch (IOException e) {
                      throw e;
                  } catch (Exception e) {
                      throw new IOException(String.valueOf(e));
                  } finally {
                      for (MediaExtractor ex : exs) {
                          try { ex.release(); } catch (Exception ignored) { }
                      }
                      if (mux != null) {
                          try { if (started) mux.stop(); } catch (Exception ignored) { }
                          try { mux.release(); } catch (Exception ignored) { }
                      }
                  }
              }

              private HttpURLConnection open(String url) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setInstanceFollowRedirects(true);
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  c.setRequestProperty("User-Agent", userAgent);
                  String cookie = CookieManager.getInstance().getCookie(url);
                  if (cookie != null) c.setRequestProperty("Cookie", cookie);
                  if (pageUrl != null && !pageUrl.isEmpty()) c.setRequestProperty("Referer", pageUrl);
                  int code = c.getResponseCode();
                  if (code >= 400) {
                      c.disconnect();
                      throw new IOException("Server said " + code);
                  }
                  return c;
              }

              private String fetchText(String url) throws IOException {
                  HttpURLConnection c = open(url);
                  try (InputStream in = c.getInputStream()) {
                      ByteArrayOutputStream b = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                      return new String(b.toByteArray(), StandardCharsets.UTF_8);
                  } finally {
                      c.disconnect();
                  }
              }

              private byte[] fetchBytes(String url) throws IOException {
                  IOException last = null;
                  for (int attempt = 0; attempt < 3; attempt++) {
                      HttpURLConnection c = null;
                      try {
                          c = open(url);
                          // Buffer each part so a failed attempt doesn't leave half a part in the file.
                          ByteArrayOutputStream b = new ByteArrayOutputStream();
                          try (InputStream in = c.getInputStream()) {
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                          }
                          return b.toByteArray();
                      } catch (IOException e) {
                          last = e;
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }
                  throw last;
              }

              // ---------- Helpers ----------

              private static String resolve(String base, String rel) throws IOException {
                  return new URL(new URL(base), rel).toString();
              }

              private static long attrLong(String line, String attr) {
                  Matcher m = Pattern.compile(attr + "=(\\d+)").matcher(line);
                  return m.find() ? Long.parseLong(m.group(1)) : 0;
              }

              private static String lastSegment(String url) {
                  String p = url;
                  int q = p.indexOf('?');
                  if (q >= 0) p = p.substring(0, q);
                  int s = p.lastIndexOf('/');
                  String seg = s >= 0 ? p.substring(s + 1) : p;
                  if (seg.isEmpty()) seg = "video";
                  if (seg.length() > 40) seg = seg.substring(0, 40) + "…";
                  return seg;
              }

              private static String extensionOf(String url, String fallback) {
                  String p = pathOf(url);
                  int dot = p.lastIndexOf('.');
                  int slash = p.lastIndexOf('/');
                  if (dot > slash && dot < p.length() - 1) {
                      String e = p.substring(dot + 1);
                      if (e.matches("[a-z0-9]{2,4}")) return e;
                  }
                  return fallback;
              }

              private static String fileName(String url, String ext) {
                  String p = url;
                  int q = p.indexOf('?');
                  if (q >= 0) p = p.substring(0, q);
                  int s = p.lastIndexOf('/');
                  String base = s >= 0 ? p.substring(s + 1) : p;
                  int dot = base.lastIndexOf('.');
                  if (dot > 0) base = base.substring(0, dot);
                  base = base.replaceAll("[^A-Za-z0-9_-]", "_");
                  if (base.isEmpty() || base.equalsIgnoreCase("index") || base.equalsIgnoreCase("playlist")
                          || base.equalsIgnoreCase("master")) base = "video";
                  if (base.length() > 40) base = base.substring(0, 40);
                  return base + "_" + (System.currentTimeMillis() % 1000000) + "." + ext;
              }

              private void setStatus(String msg) {
                  setStream(msg, -1);
              }

              private void setStream(String msg, int pct) {
                  streamMsg = msg;
                  streamPct = pct;
                  ui.post(this::renderStatus);
              }

              private void renderStatus() {
                  String msg = streamMsg;
                  int pct = streamPct;
                  if (msg == null) { msg = dmMsg; pct = dmPct; }
                  if (msg == null) {
                      statusPanel.setVisibility(View.GONE);
                      return;
                  }
                  status.setText(msg);
                  if (pct < 0) {
                      progress.setIndeterminate(true);
                  } else {
                      progress.setIndeterminate(false);
                      progress.setProgress(pct);
                  }
                  statusPanel.setVisibility(View.VISIBLE);
              }

              private static String mb(long bytes) {
                  return String.format(Locale.ROOT, "%.1f MB", bytes / 1048576.0);
              }

              // Checks Android's download queue and updates the progress bar.
              private void pollDownloads() {
                  Long[] ids;
                  synchronized (dmIds) { ids = dmIds.toArray(new Long[0]); }
                  if (ids.length == 0) {
                      if (dmMsg != null) { dmMsg = null; renderStatus(); }
                      return;
                  }
                  long[] arr = new long[ids.length];
                  for (int i = 0; i < ids.length; i++) arr[i] = ids[i];
                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  long done = 0, total = 0;
                  int active = 0;
                  boolean unknownSize = false;
                  String name = null;
                  Set<Long> seen = new HashSet<>();
                  try (Cursor c = dm.query(new DownloadManager.Query().setFilterById(arr))) {
                      while (c != null && c.moveToNext()) {
                          long id = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_ID));
                          seen.add(id);
                          int st = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                          String title = c.getString(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TITLE));
                          if (st == DownloadManager.STATUS_SUCCESSFUL) {
                              dmIds.remove(id);
                              toast("Saved " + title + " to Downloads/" + FOLDER);
                          } else if (st == DownloadManager.STATUS_FAILED) {
                              dmIds.remove(id);
                              int reason = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_REASON));
                              toast("Download failed (" + reasonText(reason) + "): " + title);
                          } else {
                              active++;
                              name = title;
                              long so = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                              long tot = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                              done += Math.max(0, so);
                              if (tot > 0) total += tot; else unknownSize = true;
                          }
                      }
                  } catch (Exception ignored) { }
                  for (Long id : ids) if (!seen.contains(id)) dmIds.remove(id); // cancelled by the user
                  if (active == 0) {
                      dmMsg = null;
                  } else {
                      String who = active > 1 ? active + " downloads… " : "Downloading " + shorten(name) + "… ";
                      if (total > 0 && !unknownSize) {
                          dmPct = (int) Math.min(100, done * 100 / total);
                          dmMsg = who + dmPct + "% (" + mb(done) + " of " + mb(total) + ")";
                      } else {
                          dmPct = -1;
                          dmMsg = who + mb(done) + " so far";
                      }
                  }
                  renderStatus();
              }

              private static String shorten(String s) {
                  if (s == null) return "video";
                  return s.length() > 28 ? s.substring(0, 28) + "…" : s;
              }

              private static String reasonText(int r) {
                  if (r >= 400 && r < 600) return "the website refused, code " + r;
                  switch (r) {
                      case DownloadManager.ERROR_INSUFFICIENT_SPACE: return "phone storage is full";
                      case DownloadManager.ERROR_TOO_MANY_REDIRECTS: return "too many redirects";
                      case DownloadManager.ERROR_HTTP_DATA_ERROR: return "connection dropped";
                      case DownloadManager.ERROR_CANNOT_RESUME: return "couldn't resume";
                      default: return "error " + r;
                  }
              }

              private void toast(String msg) {
                  ui.post(() -> Toast.makeText(this, msg, Toast.LENGTH_LONG).show());
              }
          }
          VIDGRAB_EOF

      - name: Build the app
        run: gradle assembleDebug --no-daemon

      - name: Keep a backup copy
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Put the app on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VidGrab.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest VidGrab.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "VidGrab app" --notes "Tap VidGrab.apk below to download it to your phone."
